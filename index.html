<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#efe6d6">
<title>一本堂物语：进步</title>
<style>
:root{
  --paper:#efe6d6; --paper2:#e5dac6; --ink:#2f2a24; --ink2:#6b5f4f; --ink3:#9a8d7a;
  --line:#cdbfa6; --iron:#4a4b52; --clay:#8a6a50; --tea:#c9922f; --water:#4a90c2;
  --gold:#b98a3c; --ok:#5f8a4a; --ash:#9b9b9e;
  --wood:#a5804f; --wood2:#8a6136; --wood3:#6d4a28; --woodbg:#f3e7d2;
  --shadow:0 2px 0 rgba(0,0,0,.08), 0 6px 18px rgba(60,45,25,.10);
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#221e19; --paper2:#2b2620; --ink:#ece2d2; --ink2:#b6a892; --ink3:#8b7f6c;
         --line:#4a4237; --gold:#c8a05a; --wood:#8d6d45; --wood2:#6f4f2c; --wood3:#4a3320;
         --woodbg:#332b22; --shadow:0 2px 0 rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,.55), transparent 60%),
             repeating-linear-gradient(0deg, rgba(140,110,70,.035) 0 2px, transparent 2px 4px),
             var(--paper);
  color:var(--ink); font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC",system-ui,sans-serif;
  font-size:14px; overflow:hidden; user-select:none;
}
.serif{font-family:"Songti SC","STSong","Source Han Serif SC","SimSun",serif}
#app{display:flex;flex-direction:column;height:100dvh;height:100vh;max-width:640px;margin:0 auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}

/* ---------- 顶栏 ---------- */
#hud{display:flex;align-items:center;gap:8px;padding:8px 12px 6px;flex:0 0 auto}
#brand{flex:1 1 auto;min-width:0}
#brand h1{margin:0;font-size:17px;letter-spacing:2px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#brand p{margin:1px 0 0;font-size:10px;color:var(--ink3);letter-spacing:1px}
.purse{display:flex;gap:5px;flex:0 0 auto}
.purse b{display:inline-flex;align-items:center;gap:3px;
  background:linear-gradient(#f6ecd9,#e9d8b8);border:1.5px solid var(--wood);border-radius:9px;
  padding:3px 8px;font-size:11px;font-weight:700;box-shadow:0 2px 0 rgba(120,90,50,.4), 0 3px 6px rgba(60,40,20,.14)}
@media (prefers-color-scheme: dark){.purse b{background:linear-gradient(#3d3327,#2f271e)}}
.purse b i{font-style:normal;font-size:12px}

/* ---------- 订单栏 ---------- */
#orders{display:flex;gap:8px;padding:2px 12px 8px;overflow-x:auto;flex:0 0 auto;scrollbar-width:none}
#clearedBar{display:none;font-size:12px;color:var(--ink2);line-height:1.5;padding:2px 14px 0}
#clearedBar.on{display:block}
#clearedBar b{color:var(--ok)}
#orders::-webkit-scrollbar{display:none}
.npc{flex:1 0 152px;max-width:215px;
  background:linear-gradient(var(--woodbg),var(--paper2));
  border:2px solid var(--wood);border-radius:13px;padding:8px;position:relative;transition:transform .12s,box-shadow .12s;
  box-shadow:0 3px 0 var(--wood2), 0 7px 14px rgba(60,40,20,.20)}
@media (prefers-color-scheme: dark){.npc{box-shadow:0 3px 0 var(--wood3), 0 7px 14px rgba(0,0,0,.4)}}
.npc::before,.npc::after{content:"";position:absolute;top:-5px;width:7px;height:7px;border-radius:50%;
  background:var(--wood2);box-shadow:0 1px 2px rgba(0,0,0,.4)}
.npc::before{left:11px} .npc::after{right:11px}
.npc.locked{opacity:.55;filter:grayscale(.6)}
.npc .row{display:flex;align-items:center;gap:6px}
.npc .av{width:32px;height:32px;flex:0 0 auto;border-radius:50%;overflow:hidden;border:1px solid var(--line);background:var(--paper)}
.npc .av svg{width:100%;height:100%;display:block}
.npc .who{font-weight:700;font-size:13px;letter-spacing:1px;white-space:nowrap;flex:0 0 auto}
.npc .cnt{margin-left:auto;font-size:9px;color:var(--ink3);white-space:nowrap;flex:0 0 auto}
.reqs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;min-height:30px}
.req{display:flex;align-items:center;gap:3px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:2px 6px 2px 3px;font-size:10px;opacity:.5;white-space:nowrap}
.req.ok{opacity:1;border-color:var(--ok);background:rgba(95,138,74,.13)}
.req svg{width:17px;height:17px;display:block;flex:0 0 auto}
.req b{font-weight:700;font-size:10px;color:var(--ink3)}
.req.ok b{color:var(--ok)}
.req i{font-style:normal;font-size:10px;color:var(--gold)}
.npc .give{margin-top:6px;width:100%;font:inherit;font-size:12px;font-weight:700;letter-spacing:1px;padding:6px;border-radius:9px;border:1px solid var(--gold);background:linear-gradient(#f3dcac,#e3c079);color:#4a3a16;cursor:pointer}
.npc .give.dim{opacity:.5}
.npc .give[data-ready="1"]{background:linear-gradient(#dcecd0,#b8d69a);border-color:var(--ok);color:#2d4522}
.npc .give.reroll{border-color:var(--line);background:var(--paper);color:var(--ink2);font-weight:500;margin-top:4px}
.npc .need{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:10px;color:var(--gold)}
.npc .need button{font:inherit;font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid var(--gold);background:var(--paper);color:var(--gold);cursor:pointer}

/* ---------- 棋盘：一只木托盘 ---------- */
#boardWrap{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;padding:10px 10px 8px}
#board{
  width:min(100%,calc(100vh - 356px),560px);
  width:min(100%,calc(100dvh - 356px),560px);
  aspect-ratio:1/1;
  display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(7,minmax(0,1fr));gap:5px;
  border:3px solid var(--wood2); border-radius:16px; padding:8px; position:relative;
  background:
    repeating-linear-gradient(45deg, rgba(122,90,60,.075) 0 6px, rgba(122,90,60,.075) 6px 7px, transparent 7px 14px),
    linear-gradient(var(--woodbg),var(--paper2));
  box-shadow:0 5px 0 var(--wood3), 0 11px 22px rgba(60,40,20,.26), inset 0 2px 8px rgba(255,255,255,.45);
}
@media (prefers-color-scheme: dark){
  #board{ box-shadow:0 5px 0 var(--wood3), 0 11px 22px rgba(0,0,0,.5), inset 0 2px 8px rgba(0,0,0,.35); }
}

/* ---------- 横屏布局：左边棋盘，右边信息栏（TapTap 商店按横屏发布） ---------- */
@media (orientation:landscape) and (min-width:680px){
  #app{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(340px,46%);
    grid-template-rows:auto auto minmax(0,1fr) auto auto auto;
    column-gap:10px; row-gap:0;
    max-width:none; margin:0;
    padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);
  }
  #hud{grid-row:1;grid-column:2;padding:6px 4px 4px}
  #clearedBar{grid-row:2;grid-column:2;padding:0 4px 2px}
  #orders{grid-row:3;grid-column:2;padding:2px 4px 4px;align-items:flex-start}
  #mascot{grid-row:4;grid-column:2;padding:2px 4px 2px}
  #bench{grid-row:5;grid-column:2;padding:0 4px 4px}
  #tools{grid-row:6;grid-column:1;padding:0 4px 6px}
  #boardWrap{grid-row:1/6;grid-column:1;padding:6px}
  #board{width:min(100%,calc(100vh - 34px),620px);width:min(100%,calc(100dvh - 34px),620px)}
  /* 横屏下订单卡压缩：三张并排，不用横向滑 */
  #orders{gap:6px}
  .npc{flex:1 1 124px;min-width:0;max-width:none;padding:6px 5px}
  .npc .row{flex-wrap:wrap;gap:4px}
  .npc .av{width:26px;height:26px}
  .npc .who{font-size:12px;letter-spacing:0}
  .npc .cnt{margin-left:0;font-size:8px}
  .reqs{margin-top:4px;min-height:0;gap:3px}
  .req{font-size:9px;padding:1px 4px 1px 2px;gap:2px;max-width:100%}
  .req svg{width:14px;height:14px}
  .req span{white-space:normal;overflow-wrap:anywhere;min-width:0}
  .npc .give{font-size:11px;padding:5px;margin-top:4px;letter-spacing:0}
  .npc .give.reroll{margin-top:3px}
  .npc .need{margin-top:4px;font-size:9px}
}
.cell{position:relative;border-radius:7px;background:rgba(255,255,255,.30);border:1px solid rgba(122,90,60,.14);
  display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;overflow:visible;
  box-shadow:inset 0 1px 3px rgba(90,60,30,.12), 0 1px 0 rgba(255,255,255,.35)}
@media (prefers-color-scheme: dark){.cell{background:rgba(255,255,255,.05);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}}
.cell.locked{background:rgba(90,70,40,.13)}
.slot{width:100%;height:100%;display:flex;align-items:center;justify-content:center;pointer-events:auto}
.cell .icon{width:88%;height:88%;pointer-events:none;display:block}
.cell .icon svg{width:100%;height:100%;display:block}
.cell .item{width:90%;height:90%;pointer-events:auto;cursor:grab;transition:transform .12s;
  filter:drop-shadow(0 2px 2px rgba(60,40,20,.30))}
.cell .gen{width:86%;height:86%;cursor:pointer;pointer-events:auto;filter:drop-shadow(0 2px 2px rgba(60,40,20,.28))}
.cell .obs{position:absolute;inset:2%;pointer-events:auto;cursor:pointer;filter:drop-shadow(0 3px 3px rgba(60,40,20,.35))}
.cell .obs svg{width:100%;height:100%;display:block}
.cell.under{filter:brightness(.72)}
.cell.sel{outline:2px solid var(--gold);outline-offset:-2px}
.cell.caring{outline:2px solid var(--juice,#4f7a4a);outline-offset:-2px;
  box-shadow:inset 0 0 26px var(--juice,#4f7a4a),0 0 0 3px rgba(255,255,255,.20);
  animation:careGlow 1.3s ease-in-out infinite}
@keyframes careGlow{50%{box-shadow:inset 0 0 38px var(--juice,#4f7a4a),0 0 0 4px rgba(255,255,255,.34)}}
/* 壶上动作标记：拖东西经过时亮出「烧 / 灌 / 擦」，长按养护时亮出「抹」 */
.cell.act-burn{outline:2px solid #c9602c;outline-offset:-2px;box-shadow:inset 0 0 0 999px rgba(201,96,44,.17)}
.cell.act-steep{outline:2px solid #b78a1e;outline-offset:-2px;box-shadow:inset 0 0 0 999px rgba(183,138,30,.17)}
.cell.act-water{outline:2px solid #3d86a8;outline-offset:-2px;box-shadow:inset 0 0 0 999px rgba(61,134,168,.17)}
.cell.act-wash{outline:2px solid #7d7a70;outline-offset:-2px;box-shadow:inset 0 0 0 999px rgba(125,122,112,.17)}
.cell.act-burn::after,.cell.act-steep::after,.cell.act-water::after,.cell.act-wash::after,.cell.caring::after{
  position:absolute;top:1px;left:1px;z-index:6;font-size:10px;font-weight:700;line-height:1;
  color:#fff;padding:2px 4px;border-radius:999px;pointer-events:none;letter-spacing:.5px;
  box-shadow:0 1px 2px rgba(40,28,12,.35)}
.cell.act-burn::after{content:'烧';background:#c9602c}
.cell.act-steep::after{content:'萃';background:#b78a1e}
.cell.act-water::after{content:'灌';background:#3d86a8}
.cell.act-wash::after{content:'擦';background:#7d7a70}
.cell.caring::after{content:'抹';background:#4f7a4a}
.cell.hint{outline:2px dashed var(--ok);outline-offset:-2px;animation:pulse 1s infinite}
@keyframes pulse{50%{outline-color:transparent}}
/* 障碍上的价格牌 */
.cost{position:absolute;right:-2px;top:-2px;z-index:3;background:linear-gradient(#f3dcac,#e3c079);
  border:1.5px solid var(--wood2);border-radius:999px;padding:0 4px;font-size:9px;font-weight:700;color:#4a3a16;
  display:flex;align-items:center;gap:1px;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.cost .lk{font-size:8px}
/* 养护进度环 */
.ring{position:absolute;inset:0;pointer-events:none}
.ring circle{fill:none;stroke-linecap:round}
.pop{animation:pop .3s ease-out}
@keyframes pop{0%{transform:scale(.5)}to{transform:scale(1)}}
.float{position:absolute;left:50%;top:28%;transform:translate(-50%,-50%);font-size:11px;font-weight:700;color:var(--gold);pointer-events:none;animation:fl 1s ease-out forwards;text-shadow:0 1px 2px rgba(255,255,255,.85);white-space:nowrap}
@keyframes fl{0%{opacity:0;transform:translate(-50%,-30%)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-120%)}}
#recycle{flex:0 0 auto;width:56px;min-height:38px;border:2px dashed var(--line);border-radius:10px;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--ink3);text-align:center;line-height:1.25}
#recycle small{font-size:9px;opacity:.75}
#recycle.hot{border-color:var(--gold);color:var(--gold);background:rgba(185,138,60,.14)}
#sell{flex:0 0 auto;width:60px;min-height:38px;border:2px solid var(--wood2);border-radius:10px;
  background:linear-gradient(#f6dfae,#e3c079);display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:#4a3a16;text-align:center;line-height:1.25;box-shadow:0 2px 0 var(--wood3);cursor:pointer}
#sell small{font-size:9px;font-weight:400;opacity:.8}
#sell.hot{transform:translateY(-2px);box-shadow:0 4px 0 var(--wood3)}

/* ---------- 茶童引导 ---------- */
#mascot{display:flex;gap:8px;align-items:flex-start;padding:2px 12px 4px;flex:0 0 auto}
#mascot .boy{width:48px;height:48px;flex:0 0 auto;cursor:pointer;margin-top:1px;
  filter:drop-shadow(0 3px 3px rgba(60,40,20,.32))}
#mascot .bubble{flex:1 1 auto;background:var(--paper2);border:2px solid var(--wood);border-radius:13px;
  padding:7px 11px;font-size:12px;line-height:1.6;position:relative;
  box-shadow:0 3px 0 var(--wood2), 0 6px 12px rgba(60,40,20,.14);min-height:34px}
#mascot .bubble::after{content:"";position:absolute;left:-7px;top:13px;width:12px;height:12px;
  background:var(--paper2);border-left:2px solid var(--wood);border-bottom:2px solid var(--wood);transform:rotate(45deg)}
#mascot .bubble b{color:var(--gold)}
#mascot .bubble .k{color:var(--ink3);font-size:11px}
#mascot .skip{float:right;font-size:10px;color:var(--ink3);text-decoration:underline;cursor:pointer;margin:0 0 0 8px;position:relative;z-index:2}
#mascot .tutbar{display:block;height:3px;border-radius:2px;background:rgba(0,0,0,.13);margin-top:7px;overflow:hidden;clear:both}
#mascot .tutbar i{display:block;height:100%;background:var(--gold);border-radius:2px;transition:width .3s}

/* ---------- 杂物台（不再存物，只放待开的泥模与两个投放位） ---------- */
#bench{display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:0 12px 6px;flex:0 0 auto;min-height:40px}
#benchChips{display:flex;gap:6px;flex:0 0 auto;align-items:center;overflow:hidden}
.chip{display:flex;align-items:center;gap:3px;background:var(--paper2);border:1px solid var(--line);border-radius:999px;padding:3px 9px 3px 4px;font-size:11px;cursor:grab;white-space:nowrap}
.chip svg{width:22px;height:22px;display:block}
.chip .n{font-weight:700}

/* ---------- 底部工具 ---------- */
#tools{display:flex;gap:5px;padding:0 12px 10px;flex:0 0 auto}
#tools button{flex:1 1 0;min-width:0;font:inherit;font-size:12px;padding:8px 2px;border-radius:10px;border:1px solid var(--line);background:var(--paper2);color:var(--ink);cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.05);white-space:nowrap}
#tools button:active{transform:translateY(1px)}
#tools button.off{opacity:.5}

/* ---------- 拖拽幽灵 / 涂抹轨迹 ---------- */
#ghost{position:fixed;width:56px;height:56px;pointer-events:none;z-index:999;display:none;transform:translate(-50%,-50%) scale(1.15);filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
#ghost svg{width:100%;height:100%}
#trail{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:898;display:none}
#careBar{position:fixed;z-index:899;display:none;background:rgba(38,30,20,.92);color:#f6eddc;font-size:11px;padding:3px 9px;border-radius:999px;white-space:nowrap;pointer-events:none;transform:translateX(-50%);letter-spacing:.3px}
#careBar .cj{background:#4f7a4a;color:#f2f7ee;border-radius:999px;padding:1px 6px;margin-right:6px;font-weight:700;letter-spacing:.5px}

/* ---------- 动态壁纸场景 ---------- */
#scene{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .9s}
#scene.on{opacity:1}
#scene.sc-season{background:linear-gradient(180deg,#33465c 0%,#4c637a 42%,#7d8f9c 100%)}
#scene.sc-ten{background:linear-gradient(180deg,#0e1728 0%,#1a2b45 48%,#28425e 100%)}
#scene.sc-craft{background:linear-gradient(180deg,#33261a 0%,#453121 55%,#5a3f27 100%)}
#scene .flake,#wallpaper .flake,.fx .flake{position:absolute;top:-14px;width:5px;height:5px;border-radius:50%;background:#fff;opacity:.9;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-14px) translateX(0);opacity:.9}
  50%{transform:translateY(48vh) translateX(16px)}
  100%{transform:translateY(104vh) translateX(-12px);opacity:.15}}
#scene .moon,#wallpaper .moon,.fx .moon{position:absolute;right:13%;top:10%;width:62px;height:62px;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#fdf6dc,#e8d9a8 58%,#cdb87e);
  box-shadow:0 0 44px rgba(253,246,220,.5)}
#scene .water,#wallpaper .water,.fx .water{position:absolute;left:0;right:0;bottom:0;height:36%;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.13));border-top:1px solid rgba(255,255,255,.16)}
#scene .water::after,#wallpaper .water::after,.fx .water::after{content:"";position:absolute;left:0;right:0;top:0;height:100%;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.13) 0 1px,transparent 1px 7px);
  -webkit-mask-image:linear-gradient(180deg,#000,transparent 88%);mask-image:linear-gradient(180deg,#000,transparent 88%);
  animation:shimmer 4.2s ease-in-out infinite alternate}
@keyframes shimmer{from{transform:translateY(0)}to{transform:translateY(7px)}}
#scene .moon::after,#wallpaper .moon::after,.fx .moon::after{content:"";position:absolute;left:50%;top:98%;width:54px;height:230px;
  transform:translateX(-50%);background:linear-gradient(180deg,rgba(253,246,220,.26),transparent);filter:blur(2px);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 38%,#000 62%,transparent);mask-image:linear-gradient(90deg,transparent,#000 38%,#000 62%,transparent)}
#scene .lamp,#wallpaper .lamp,.fx .lamp{position:absolute;left:10%;top:14%;width:86px;height:112px;border-radius:46% 46% 48% 48%;
  background:radial-gradient(circle at 50% 38%,#ffd79a,#e08a3c 72%);opacity:.5;filter:blur(2px);animation:flick 3.6s ease-in-out infinite alternate}
#scene .lamp2,#wallpaper .lamp2,.fx .lamp2{position:absolute;right:16%;top:22%;width:58px;height:76px;border-radius:46% 46% 48% 48%;
  background:radial-gradient(circle at 50% 38%,#ffe0ae,#d8823a 72%);opacity:.42;filter:blur(2px);animation:flick 4.4s ease-in-out infinite alternate-reverse}
@keyframes flick{from{opacity:.38}to{opacity:.62}}
#scene .steam,#wallpaper .steam,.fx .steam{position:absolute;left:0;right:0;bottom:0;height:46%;
  background:linear-gradient(180deg,transparent,rgba(255,240,215,.07));animation:steam 7s ease-in-out infinite alternate}
@keyframes steam{from{transform:translateY(8px);opacity:.5}to{transform:translateY(-10px);opacity:.9}}
.fx{position:absolute;inset:0;pointer-events:none}

/* ---------- 全屏动态壁纸 ---------- */
#wallpaper{position:fixed;inset:0;z-index:1200;display:none;overflow:hidden}
#wallpaper.on{display:block}
#wallpaper.sc-season{background:linear-gradient(180deg,#33465c 0%,#4c637a 42%,#7d8f9c 100%)}
#wallpaper.sc-ten{background:linear-gradient(180deg,#0e1728 0%,#1a2b45 48%,#28425e 100%)}
#wallpaper.sc-craft{background:linear-gradient(180deg,#33261a 0%,#453121 55%,#5a3f27 100%)}
#wallpaper .close{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:50%;
  background:rgba(0,0,0,.42);color:#fff;border:0;font-size:19px;cursor:pointer;line-height:1}
#wallpaper .wname{position:absolute;left:0;right:0;bottom:40px;text-align:center;color:#fff;
  font-size:16px;letter-spacing:5px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
#wallpaper .wsub{position:absolute;left:0;right:0;bottom:18px;text-align:center;color:rgba(255,255,255,.72);
  font-size:11px;letter-spacing:2px}
#wallpaper .flake,#wallpaper .moon,#wallpaper .water,#wallpaper .lamp,#wallpaper .lamp2,#wallpaper .steam{position:absolute}

/* ---------- 泥模 / 纹样 ---------- */
.chip.mold{background:linear-gradient(#e7d3b4,#d8bd93);border-color:var(--gold);animation:moldGlow 1.8s ease-in-out infinite}
.chip.mold .mi{width:24px;height:24px;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.chip.mold i{font-style:normal;font-size:10px;color:var(--gold);font-weight:700}
@keyframes moldGlow{0%,100%{box-shadow:0 0 0 0 rgba(185,138,60,.5)}50%{box-shadow:0 0 0 5px rgba(185,138,60,0)}}
.reveal{position:relative;height:158px;display:flex;align-items:center;justify-content:center}
.reveal .mold{width:92px;height:92px;transition:transform .45s ease-in, opacity .45s}
.reveal .mold.crack{transform:scale(1.2) rotate(10deg);opacity:0}
.reveal .pot{position:absolute;width:126px;height:126px;opacity:0;transform:scale(.55);
  transition:opacity .45s ease-out, transform .45s cubic-bezier(.2,1.6,.4,1);filter:drop-shadow(0 6px 12px rgba(0,0,0,.35))}
.reveal .pot.show{opacity:1;transform:scale(1)}
.rvname{font-size:16px;font-weight:700;letter-spacing:2px;text-align:center;margin-top:2px}
.rvline{font-size:12px;color:var(--ink2);text-align:center;margin-top:3px}
.rvnew{display:inline-block;margin-top:8px;padding:3px 14px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:3px;
  background:linear-gradient(#f3dcac,#e3c079);border:1.5px solid var(--wood2);color:#4a3a16}
.rvset{font-size:11px;color:var(--ink3);text-align:center;margin-top:8px}
.rvunlock{margin-top:10px;text-align:center;font-size:12px;line-height:1.6;background:rgba(185,138,60,.13);
  border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:8px 10px}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.pslot{background:var(--paper2);border:1px solid var(--line);border-radius:9px;padding:5px 3px;text-align:center;position:relative}
.pslot.lock{opacity:.42;filter:grayscale(1)}
.pslot svg{width:100%;height:auto;display:block}
.pslot .pn{font-size:9px;line-height:1.3;margin-top:2px}
.pslot .pc{position:absolute;right:2px;top:1px;font-size:9px;font-weight:700;color:var(--gold)}
.pslot.done{box-shadow:0 0 0 2px rgba(185,138,60,.45)}
.pset{margin-top:12px}
.pset .ph{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:1px;margin-bottom:2px}
.pset .ph em{font-style:normal;font-size:10px;color:var(--ink3);font-weight:400;margin-left:auto}

/* ---------- 图鉴页签 / 光标引导 ---------- */
.cxtabs{display:flex;gap:5px;margin-bottom:10px}
.cxtabs button{flex:1;font:inherit;font-size:12px;font-weight:700;letter-spacing:1px;padding:7px 2px;border-radius:9px;
  border:1px solid var(--line);background:var(--paper2);color:var(--ink2);cursor:pointer}
.cxtabs button.on{background:linear-gradient(#f3dcac,#e3c079);border-color:var(--wood2);color:#4a3a16}
.rsec{font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:1px;margin:11px 0 4px}
.rrow{display:flex;align-items:center;gap:3px;flex-wrap:wrap;padding:5px 8px;border-radius:8px;
  background:var(--paper2);border:1px solid var(--line);margin-bottom:4px;font-size:11px;line-height:1.5}
.rrow.got{border-color:var(--ok);background:rgba(95,138,74,.10)}
.rrow i{font-style:normal;color:var(--ink3);padding:0 1px}
.rrow .ro{font-weight:700;color:var(--ink3)}
.rrow.got .ro{color:var(--ok)}
.rrow .rd{margin-left:auto;font-size:9px;color:var(--ink3);flex:0 0 auto}
.npc .firsttag{display:inline-block;margin-left:5px;padding:1px 6px;border-radius:999px;font-size:9px;font-weight:700;
  background:linear-gradient(#f3dcac,#e3c079);border:1px solid var(--wood2);color:#4a3a16;vertical-align:1px}
#guide{position:fixed;z-index:940;pointer-events:none;transform:translate(-50%,-50%);width:0;height:0;
  opacity:0;visibility:hidden;
  transition:left .5s cubic-bezier(.22,.9,.28,1), top .5s cubic-bezier(.22,.9,.28,1), opacity .3s, visibility .3s}
#guide.on{opacity:1;visibility:visible}
#guide .ring{position:absolute;left:0;top:0;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;
  border:2px solid var(--gold);animation:gpulse 1.5s ease-out infinite}
#guide .hand{position:absolute;left:0;top:0;width:38px;height:38px;margin:-8px 0 0 -15px;
  animation:gbob 1.1s ease-in-out infinite;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
@keyframes gpulse{0%{transform:scale(.55);opacity:.95}100%{transform:scale(1.45);opacity:0}}
@keyframes gbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
/* 拖动时跟着手指的物品名 */
#dragLabel{position:fixed;z-index:1001;pointer-events:none;display:none;transform:translate(-50%,0);
  background:rgba(38,30,20,.93);color:#f6eddc;font-size:11px;padding:3px 10px;border-radius:999px;white-space:nowrap;
  box-shadow:0 3px 10px rgba(0,0,0,.35);letter-spacing:.5px}
#dragLabel b{color:var(--gold);font-weight:600}

/* ---------- 弹层 ---------- */
#modal{position:fixed;inset:0;background:rgba(30,22,12,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:1000;backdrop-filter:blur(2px)}
#modal.on{display:flex}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:16px;max-width:420px;width:100%;max-height:82vh;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.35);animation:rise .22s ease-out}
/* 只动位移，不动 opacity：动画没跑起来时弹层也必须可见 */
@keyframes rise{from{transform:translateY(16px)}to{transform:translateY(0)}}
.sheet h2{margin:0;padding:14px 16px 8px;font-size:17px;letter-spacing:2px}
.sheet .body{padding:0 16px 14px;font-size:13px;line-height:1.75}
.sheet .foot{display:flex;gap:8px;padding:0 16px 16px}
.sheet .foot button{flex:1;font:inherit;font-size:13px;font-weight:700;padding:10px;border-radius:10px;border:1px solid var(--gold);background:linear-gradient(#f3dcac,#e3c079);color:#4a3a16;cursor:pointer}
.sheet .foot button.ghostbtn{border-color:var(--line);background:var(--paper2);color:var(--ink2);font-weight:500}
.sheet hr{border:0;border-top:1px dashed var(--line);margin:12px 0}
.talk{display:flex;gap:9px;align-items:flex-start}
.talk .av{width:46px;height:46px;flex:0 0 auto;border-radius:50%;overflow:hidden;border:1px solid var(--line)}
.talk .av svg{width:100%;height:100%;display:block}
.talk .bal{flex:1 1 auto;background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:13px;line-height:1.7}
.deliv{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 2px}
.deliv .d{display:flex;align-items:center;gap:7px;background:var(--paper2);border:1px solid var(--line);border-radius:10px;padding:6px 10px 6px 6px;flex:1 1 160px}
.deliv .d svg{width:30px;height:30px;display:block;flex:0 0 auto}
.deliv .d .nm{font-weight:700;font-size:12px}
.deliv .d .tx{font-size:11px;color:var(--ink2);line-height:1.5}
.fact{background:rgba(185,138,60,.11);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:8px 10px;font-size:12px;line-height:1.7;color:var(--ink2)}
.fact b{color:var(--ink)}
.praise{background:rgba(95,138,74,.13);border-left:3px solid var(--ok);border-radius:0 8px 8px 0;padding:8px 10px;font-size:12px;line-height:1.7}
.rewards{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.rewards span{background:var(--paper2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.rewards span.bonus{border-color:var(--ok);color:var(--ok)}
.entry{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.entry:last-child{border-bottom:0}
.entry svg{width:30px;height:30px;flex:0 0 auto}
.entry .t{font-size:12px;line-height:1.6}
.entry .t b{font-size:12.5px}
.entry .t .sub{color:var(--ink3);font-size:11px}
.empty{text-align:center;color:var(--ink3);font-size:12px;padding:22px 8px;line-height:1.9}
.tip{display:flex;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12px;line-height:1.7}
.tip:last-child{border-bottom:0}
.tip .n{color:var(--ink3);flex:0 0 auto;font-variant-numeric:tabular-nums}
.garden{display:flex;align-items:center;gap:9px;margin:8px 0;padding:8px 10px;background:var(--paper2);border:1px solid var(--line);border-radius:12px}
.garden svg{width:36px;height:36px;flex:0 0 auto}
.garden .g1{flex:1 1 auto}
.garden .g1 b{font-size:13px}
.garden .g1 div{font-size:11px;color:var(--ink3);line-height:1.5}
.garden button{font:inherit;font-size:11px;padding:5px 11px;border-radius:999px;border:1px solid var(--gold);background:linear-gradient(#f3dcac,#e3c079);color:#4a3a16;cursor:pointer;white-space:nowrap}
.garden button:disabled{opacity:.45}
.sect{font-weight:700;font-size:13px;letter-spacing:1px;margin:14px 0 4px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.sect:first-child{margin-top:0}

/* ---------- 竖屏转屏提示 ---------- */
#rotateTip{position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:1050;display:none;
  align-items:center;gap:8px;width:max-content;max-width:calc(100vw - 16px);
  background:rgba(38,30,20,.94);color:#f6eddc;
  font-size:11.5px;padding:7px 10px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#rotateTip .rtx{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rotateTip button{font:inherit;font-size:11px;padding:3px 9px;border-radius:999px;cursor:pointer;
  border:1px solid var(--gold);background:var(--gold);color:#4a3a16;flex:0 0 auto}
@media (orientation:portrait) and (max-width:679px){
  #rotateTip.show{display:flex}
}
/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:1100;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:rgba(38,30,20,.93);color:#f6eddc;padding:8px 15px;border-radius:999px;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.3);animation:tin .3s ease-out;max-width:88vw;text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
</style>
</head>

<div id="modal"><div class="sheet" id="sheet"></div></div>

<script>
"use strict";
/* =========================================================================
   《一本堂物语：进步》 v2
   新增：钥匙B 铁壶养护（涂抹手势） / 钥匙C 茶叶变体（茶种 × 时节）
   ========================================================================= */

const $ = s => document.querySelector(s);
const SV = inner => '<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">'+inner+'</svg>';

function toast(msg){
  const t=document.createElement('div');
  t.textContent=msg;
  $('#toast').appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .35s'; t.style.opacity='0'; setTimeout(()=>t.remove(),380); }, 1900);
}

/* ---------------- 颜色 ---------------- */
function hsl(h,s,l){ return 'hsl('+((h%360)+360)%360+','+Math.max(0,Math.min(100,s))+'%,'+Math.max(0,Math.min(100,l))+'%)'; }

/* ---------------- 茶种 × 时节 ---------------- */

  hm: {id:'hm', name:'九曲红梅', scent:'花果香', h:8, s:54, l:42, teaH:12, teaS:62, teaL:37, gen:'红梅茶园', price:220, note:'发酵成红茶，汤色红浓，香如梅花'}
};

  yq:{id:'yq',name:'雨前',tier:2,dl:0, ds:0, tdl:0, desc:'雨前芽叶，味厚有骨'},
  mq:{id:'mq',name:'明前',tier:3,dl:10,ds:-8,tdl:9, desc:'清明前单芽，产量少，味最鲜'}
};
const SEASON_ORDER=['cw','yq','mq'];

/* ---------------- 图形 ---------------- */
function rock(c1,c2,extra){
  return '<path d="M7 35c-1-7 4-10 7-14 3-4 5-9 10-10 6-1 9 4 12 8 3 4 6 6 6 11 0 7-7 10-13 11H20c-7 0-12-3-13-6z" fill="'+c1+'"/>'+
         '<path d="M19 13c4 3 6 7 4 12-2 6-6 9-12 8 1-5 1-9 3-13 1-3 3-5 5-7z" fill="'+c2+'" opacity=".7"/>'+(extra||'');
}
function teapot(c1,c2,acc,extra){
  return '<path d="M38 27c6 0 9 4 9 8s-3 8-9 8" fill="none" stroke="'+c2+'" stroke-width="3.6" stroke-linecap="round"/>'+
         '<path d="M12 28c-5 0-8.5 2.5-10 6 2.5-1.5 5.5-1.5 8 0-2 1.5-3.5 3.5-3.5 6.5 3.5-4.5 8.5-7 13-7z" fill="'+c2+'"/>'+
         '<path d="M13 26c0-6 4.5-10 11-10s11 4 11 10v6c0 5.5-4.5 9.5-11 9.5s-11-4-11-9.5z" fill="'+c1+'"/>'+
         '<path d="M16 19c-2.5 6-2.5 14 1 21" fill="none" stroke="'+acc+'" stroke-width="2.6" stroke-linecap="round" opacity=".9"/>'+
         '<path d="M16 16c0-4.5 3.5-8 8-8s8 3.5 8 8z" fill="'+c2+'"/>'+
         '<circle cx="24" cy="6.6" r="2.5" fill="'+acc+'"/>'+
         '<path d="M16 41.5h16" stroke="'+c2+'" stroke-width="3.4" stroke-linecap="round"/>'+(extra||'');
}
/* 粗坯：没打磨的泥模铁胎，块面、接缝、短嘴 */
function potRough(c1,c2,acc,extra){
  return '<path d="M12 22c-4 5-4 13-1 18 3 5 10 7 15 6 6-1 11-5 11-11 0-4-2-9-4-13z" fill="'+c1+'"/>'+
         '<path d="M10 25c-4 2-6 6-6 10 2-3 5-4 8-4z" fill="'+c2+'"/>'+

         '<path d="M29 27c3 1 4 3 3 5" fill="none" stroke="'+acc+'" stroke-width="2.6" stroke-linecap="round"/>'+
         '<path d="M15 42h15" stroke="'+c2+'" stroke-width="3.2" stroke-linecap="round"/>'+(extra||'');
}
/* 直筒：高身筒体、直嘴长把 */
function potTube(c1,c2,acc,extra){
  return '<path d="M37 25c5 1 8 6 8 11s-3 10-8 11" fill="none" stroke="'+c2+'" stroke-width="3.4" stroke-linecap="round"/>'+

         '<path d="M16 42h16" stroke="'+c2+'" stroke-width="3.2" stroke-linecap="round"/>'+(extra||'');
}
/* 矮胖：短身宽口、圆耳把 */
function potSquat(c1,c2,acc,extra){
  return '<path d="M37 25c7 0 11 4 11 8s-4 8-11 8" fill="none" stroke="'+c2+'" stroke-width="3.6" stroke-linecap="round"/>'+
         '<path d="M14 30c-4 0-7 1-9 3 2-1 5-1 8 0z" fill="'+c2+'"/>'+
         '<path d="M13 27c0-5 5-8 11-8s11 3 11 8v5c0 5-5 8-11 8s-11-3-11-8z" fill="'+c1+'"/>'+
         '<path d="M15 26c3.5-3.5 14-3.5 18 0" fill="none" stroke="'+acc+'" stroke-width="2.4" stroke-linecap="round" opacity=".9"/>'+
         '<path d="M18 19c0-3.5 2.6-6 6-6s6 2.5 6 6z" fill="'+c2+'"/>'+
         '<circle cx="24" cy="11" r="2.4" fill="'+acc+'"/>'+
         '<path d="M16 40h16" stroke="'+c2+'" stroke-width="3.4" stroke-linecap="round"/>'+(extra||'');
}
const STEAM='<path d="M19 14c0-3 3-3 3-6M25 13c0-3 3-3 3-6M31 15c0-2 2-2 2-5" fill="none" stroke="#c9bda4" stroke-width="1.8" stroke-linecap="round" opacity=".85"/>';
/* 茶器三种器型：春尾粗陶碗 / 雨前盖碗 / 明前高杯 */
function cupBowl(l1,l2){
  return '<path d="M8 22h32c0 9-7 15-16 15S8 31 8 22z" fill="#f0e6d2" stroke="#d9cdb4" stroke-width="1.4"/>'+
         '<path d="M9.5 22h29c-1 3-4 5-8 6H17.5c-4-1-7-3-8-6z" fill="'+l1+'"/>'+
         '<path d="M13 26c2 3 5 4 8 4" fill="none" stroke="'+l2+'" stroke-width="1.8" opacity=".45" stroke-linecap="round"/>'+
         '<path d="M6 38h36" stroke="#c9bda4" stroke-width="3" stroke-linecap="round"/>';
}
function cupGaiwan(l1,l2){
  return '<path d="M12 25h24v6c0 5-5 9-12 9s-12-4-12-9v-6z" fill="#f6efe1" stroke="#ddd2bd" stroke-width="1.5"/>'+
         '<path d="M13 27h22v3c0 4-4 7-11 7s-11-3-11-7z" fill="'+l1+'"/>'+
         '<path d="M11 21h26c0 2-2 3.2-4 3.2H15c-2 0-4-1.2-4-3.2z" fill="#eae0cc" stroke="#c9bda4" stroke-width="1.2"/>'+

function juiceColor(t){
  if(!t) return '#d8b455';
  if(t.chain==='brew2') return '#e8c46a';
  const o=ORIGINS[t.origin], sn=SEASONS[t.season]||SEASONS.cw;
  if(!o) return '#c8a35a';
  return hsl(o.teaH,Math.min(85,o.teaS+10),Math.min(62,(o.teaL+(sn.tdl||0))+8));

function potIconHTML(cell){
  const st=POT_STYLE[cell.id];
  if(!st) return iconHTML(cell.id);
  const t=Math.min(1,(cell.aged||0)/200);
  const c1=mixHex(st.c1,'#6b4a2e',t*0.62);
  const c2=mixHex(st.c2,'#452c1c',t*0.62);
  const acc=mixHex(st.acc,'#f0c98d',t*0.55);
  let out=SV(st.draw(c1,c2,acc,st.extra));
  // 茶汁痕：抹过的壶上留一层亮亮的汁，抹一次厚一分
  const jn=cell.juiceN||0;
  if(jn>0){
    const jc=cell.juice||'#d8b455';
    const jt=Math.min(0.6,0.2+jn*0.05);
    // 壶身外的柔光：一眼看见「这只壶抹过」
    out+='<circle cx="24" cy="30" r="18" fill="'+jc+'" opacity="'+(jt*0.30).toFixed(2)+'"/>';

/* 壶的档位：生铁壶胚 1 / 素面铁壶 2 / 防锈铁壶 3 / 一本堂茶壶 4 */
const POT_TIER={'生铁壶胚':1,'素面铁壶':2,'防锈铁壶':3,'一本堂茶壶':4};
function potTier(id){ return POT_TIER[id]||0; }
function mergeResult(a,b){
  const A=ALL[a], B=ALL[b];
  if(!A||!B) return null;
  const aWater=(a==='净水'), bWater=(b==='净水');
  const aCanBrew=potTier(a)>=2, bCanBrew=potTier(b)>=2;      // 素面及以上才烧得了茶
  const aGoodPot=potTier(a)>=3, bGoodPot=potTier(b)>=3;      // 防锈及以上才配得上特调
  if(A.chain==='leaf'&&B.chain==='leaf'){
    if(A.origin!==B.origin) return {err:'不同茶种不能混'};
    const i=SEASON_ORDER.indexOf(A.season);
    if(i>=SEASON_ORDER.length-1) return {err:'已是明前，攒着卖吧'};
    return {id:leafId(A.origin,SEASON_ORDER[i+1])};
  }
  /* 茶叶 + 净水 → 生茶（还没煮，不能交单） */
  if(A.chain==='leaf'&&bWater) return {id:rawId(A.origin,A.season)};
  if(B.chain==='leaf'&&aWater) return {id:rawId(B.origin,B.season)};
  /* 生茶 + 壶 → 茶汤（用壶烧；壶不消耗，烧完还在） */
  if(A.chain==='raw'&&bCanBrew)  return {id:teaId(A.origin,A.season), keepPot:true};
  if(B.chain==='raw'&&aCanBrew)  return {id:teaId(B.origin,B.season), keepPot:true};
  /* 茶汤 + 好壶 → 特调茶（壶不消耗） */
  if(A.chain==='tea'&&bGoodPot)   return {id:brewId(A.origin,A.season), keepPot:true};
  if(B.chain==='tea'&&aGoodPot)   return {id:brewId(B.origin,B.season), keepPot:true};
  if(A.chain==='brew'&&B.chain==='brew') return {id:'顶级香茗'};
  const k=[a,b].sort().join('|');
  if(STATIC_RECIPE[k]) return {id:STATIC_RECIPE[k]};
  return null;
}

  ['C','C','W','C','C','W','C'],
  ['C','K','C','B','C','C','D'],
  ['W','C','E','.','.','F','C'],
  ['C','A','C','.','.','.','C'],
  ['C','C','.','.','.','.','W'],
  ['W','C','G','.','.','I','C'],
  ['C','W','C','C','J','C','C']
];
const GENOF={A:'铁砧',B:'陶窑',D:'炒茶灶',E:'铁矿堆',F:'泥料坑',G:'龙井茶园',I:'水缸',J:'水车',K:'草木灰炉'};
const SPECIALS=['铁砧','陶窑','炒茶灶','水车','草木灰炉'];

function freshCells(){
  const cells=[];
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    const ch=LAYOUT[r][c];
    if(ch==='.')cells.push({t:'empty'});
    else if(ch==='C')cells.push({t:'crate'});
    else if(ch==='W')cells.push({t:'weed'});
    else cells.push({t:'gen',gen:GENOF[ch],covered:SPECIALS.indexOf(GENOF[ch])>=0});
  }
  return cells;
}

function load(){
  try{
    const raw=localStorage.getItem(SAVEKEY);
    if(!raw) return null;
    const s=JSON.parse(raw);
    if(!s||!Array.isArray(s.cells)||s.cells.length!==NCELL) return null;
    ['fan','scholar','master'].forEach(id=>{
      if(!s.progress)s.progress={}; if(!s.progress[id])s.progress[id]={};
      if(!s.slotTex)s.slotTex={};  if(!s.slotTex[id])s.slotTex[id]=[];
      if(!s.slotLog)s.slotLog={};  if(!s.slotLog[id])s.slotLog[id]=[];
      if(!s.slotItems)s.slotItems={}; if(!s.slotItems[id])s.slotItems[id]=[];
      if(!s.orders)s.orders={};  if(!s.orders[id])s.orders[id]={origin:'lj',pref:'mq'};
    });
    if(!s.stash)s.stash={}; if(!s.served)s.served={fan:0,scholar:0,master:0};
    if(typeof s.cleared!=='boolean')s.cleared=false;
    if(!s.tipsSeen)s.tipsSeen=[]; if(!s.codex)s.codex=[]; if(!s.teas)s.teas=[];
    if(!s.gardens)s.gardens={lj:true,hm:false};
    if(!s.clay)s.clay={}; if(!s.scenes)s.scenes={}; if(typeof s.clayBoxes!=='number')s.clayBoxes=0;
    if(!s.tut)s.tut={idx:0,latch:{},got:{leaf:0,yq:0,mq:0,water:0,raw:0,pot:0,tea:0,ash:0,top:0,rub:0,potWater:0,wash:0,delivered:0,delivered2:0,delivered3:0}};
    if(!s.tut.got) s.tut.got={};
    ['leaf','yq','mq','water','raw','pot','tea','ash','top','rub','potWater','wash','delivered','delivered2','delivered3']
      .forEach(function(k){ if(typeof s.tut.got[k]!=='number') s.tut.got[k]=0; });
    if(!s.found)s.found={}; if(!s.recipes)s.recipes={};
    if(!s.coach)s.coach={pot:false};
    return migrate(s);
  }catch(e){ return null; }
}

/* 老存档迁移：三个产区（狮峰山/梅家坞/满觉陇）→ 两种主茶（西湖龙井/九曲红梅）
   物品 id 形如 L_lj_cw / C_hm_mq / B_hm_cw。 */
const OLD_ORIGIN={sf:'lj',mjw:'lj',mjl:'hm'};
function migOrigin(o){ return (o&&OLD_ORIGIN[o])||o; }
function migId(id){
  if(typeof id!=='string') return id;
  const m=id.match(/^([LRCB])_([a-z]+)_([a-z]+)$/);
  if(!m) return id;
  const n=migOrigin(m[2]);
  return n===m[2]?id:m[1]+'_'+n+'_'+m[3];
}
function migrate(s){
  if(!s) return s;
  (s.cells||[]).forEach(function(c){ if(c&&c.id) c.id=migId(c.id); });
  ['fan','scholar','master'].forEach(function(id){
    if(s.orders&&s.orders[id]&&s.orders[id].origin) s.orders[id].origin=migOrigin(s.orders[id].origin);
  });
  if(s.gardens){
    const g={};
    Object.keys(s.gardens).forEach(function(k){ const n=migOrigin(k); g[n]=g[n]||s.gardens[k]; });
    /* 开过任何一个付费旧茶园（梅家坞 240 / 满觉陇 560）→ 红梅园直接解锁，别让老玩家再付一次钱 */
    if(s.gardens.mjw||s.gardens.mjl) g.hm=true;
    s.gardens=g;
  }
  if(s.found){ const f={}; Object.keys(s.found).forEach(function(k){ const n=migId(k); f[n]=f[n]||s.found[k]; }); s.found=f; }
  if(s.recipes){
    const r={};
    Object.keys(s.recipes).forEach(function(k){
      let nk=k;
      if(k!=='__brew2') nk=k.split('|').map(migId).sort().join('|');
      const v=s.recipes[k];
      r[nk]=r[nk]||(v&&{a:migId(v.a),b:migId(v.b),out:migId(v.out),date:v.date});
    });
    s.recipes=r;
  }
  if(Array.isArray(s.teas)) s.teas=s.teas.map(migId);
  if(Array.isArray(s.codex)) s.codex.forEach(function(e){
    if(e){ if(e.item) e.item=migId(e.item); if(e.id) e.id=migId(e.id); if(e.teaO) e.teaO=migOrigin(e.teaO); }
  });
  if(s.slotItems) Object.keys(s.slotItems).forEach(function(k){
    (s.slotItems[k]||[]).forEach(function(e){ if(e&&e.item) e.item=migId(e.item); });
  });
  if(s.slotLog) Object.keys(s.slotLog).forEach(function(k){
    s.slotLog[k]=(s.slotLog[k]||[]).map(migId);
  });
  return s;
}

const Snd={
  ctx:null,
  boot(){ if(!this.ctx){ const AC=window.AudioContext||window.webkitAudioContext; if(AC)this.ctx=new AC(); } if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume(); },
  tone(f,t,dur,type,vol){
    if(!this.ctx)return;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t+dur+0.03);
  },
  noise(t,dur,vol,freq,q){
    if(!this.ctx)return;
    const len=Math.floor(this.ctx.sampleRate*dur);
    const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
    const src=this.ctx.createBufferSource(); src.buffer=buf;
    const f=this.ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=q||1.2;
    const g=this.ctx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(f); f.connect(g); g.connect(this.ctx.destination); src.start(t); src.stop(t+dur);
  },
  click(){ if(!this.ctx)return; const t=this.ctx.currentTime; this.tone(760,t,0.07,'triangle',0.06); },
  ding(){ if(!this.ctx)return; const t=this.ctx.currentTime;
    this.tone(1180,t,0.42,'triangle',0.10); this.tone(1770,t+0.004,0.30,'triangle',0.05); this.noise(t,0.09,0.05,2600,2.4); },
  gurgle(){ if(!this.ctx)return; const t=this.ctx.currentTime;
    for(let i=0;i<3;i++) this.tone(150+i*22+Math.random()*20,t+i*0.11,0.16,'sine',0.08);
    this.noise(t+0.05,0.22,0.022,520,0.9); },
  chime(){ if(!this.ctx)return; const t=this.ctx.currentTime; [523,659,784,1047].forEach((f,i)=>this.tone(f,t+i*0.075,0.42,'triangle',0.075)); },
  thud(){ if(!this.ctx)return; const t=this.ctx.currentTime; this.noise(t,0.16,0.07,180,0.8); this.tone(110,t,0.14,'sine',0.07); },
  coin(){ if(!this.ctx)return; const t=this.ctx.currentTime; this.tone(1320,t,0.10,'triangle',0.06); this.tone(1980,t+0.06,0.14,'triangle',0.045); },
  rub(){ if(!this.ctx)return; const t=this.ctx.currentTime; this.noise(t,0.13,0.028,900+Math.random()*700,0.7); }
};

function noteCraft(id){

  const it=ALL[id]; if(!it) return;
  // 按「链 + 时节 + 档位」记，不写死具体 id：改茶种、改产区都不会再把引导卡住
  if(it.chain==='leaf'&&it.season==='cw') t.got.leaf=1;
  else if(it.chain==='leaf'&&it.season==='yq') t.got.yq=1;
  else if(it.chain==='leaf'&&it.season==='mq') t.got.mq=1;
  else if(it.chain==='water'&&it.tier>=2) t.got.water=1;
  else if(it.chain==='tea') t.got.tea=1;
  else if(it.chain==='raw') t.got.raw=1;
  else if(it.chain==='ash') t.got.ash=1;
  else if(it.chain==='brew2') t.got.top=1;
  else if(it.chain==='pot'&&potTier(id)>=2) t.got.pot=1;
}
function tutorialStep(){
  const t=state.tut; if(!t) return null;
  while(t.idx<TUT_STEPS.length){
    const s=TUT_STEPS[t.idx];
    if(t.latch[s.id] || (t.got&&t.got[s.got])){ t.latch[s.id]=true; t.idx++; continue; }
    return s;
  }
  return null;

  if(state.cleared && teaOn && !potOn) return '大爷的单子升级成<b>特调茶</b>了，得用好壶：铁矿堆出<b>精铁矿</b>、泥料坑出<b>泥模</b>，合出壶胚，两只壶胚合成<b>素面铁壶</b>；壶要养到<b>防锈</b>以上，<b>茶汤</b>拖上去才萃得出特调。';

/* ---------------- 棋盘几何 ---------------- */
function idxOf(r,c){ return r*SIZE+c; }
function isOpen(i){ const c=state.cells[i]; return c.t==='empty'||c.t==='item'||(c.t==='gen'&&!c.covered); }
function adjacentOpen(i){
  const r=Math.floor(i/SIZE),c=i%SIZE,nb=[];
  if(r>0)nb.push(idxOf(r-1,c)); if(r<SIZE-1)nb.push(idxOf(r+1,c));
  if(c>0)nb.push(idxOf(r,c-1)); if(c<SIZE-1)nb.push(idxOf(r,c+1));
  return nb.some(isOpen);
}
function freeCellNear(i){
  const seen=new Set([i]),q=[[i,0]];
  while(q.length){
    const cur=q.shift()[0], r=Math.floor(cur/SIZE),c=cur%SIZE,nb=[];
    if(r>0)nb.push(idxOf(r-1,c)); if(r<SIZE-1)nb.push(idxOf(r+1,c));
    if(c>0)nb.push(idxOf(r,c-1)); if(c<SIZE-1)nb.push(idxOf(r,c+1));
    for(const n of nb){
      if(seen.has(n))continue; seen.add(n);
      if(state.cells[n].t==='empty') return n;
      q.push([n,0]);
    }
  }
  return -1;
}

/* ---------------- 操作 ---------------- */
function produce(i){
  const c=state.cells[i];
  if(c.t!=='gen'||c.covered) return;
  const out=GENS[c.gen].out();
  const t=freeCellNear(i);
  if(t<0){ toast('棋盘满了，先合并掉一些东西'); sfx('thud'); return; }
  state.cells[t]={t:'item',id:out,patina:0,tare:0,charges:0,rubs:0};
  noteFound(out);
  noteCraft(out);
  sfx('click'); render();
  const cell=document.querySelector('.cell[data-i="'+t+'"] .item');
  if(cell) cell.classList.add('pop');
  floatText(t,ALL[out].name);
  save();
}
function floatText(i,txt){
  const cell=document.querySelector('.cell[data-i="'+i+'"]');
  if(!cell) return;
  const f=document.createElement('div'); f.className='float'; f.textContent=txt;
  cell.appendChild(f); setTimeout(()=>f.remove(),1000);
}
function doMerge(targetIdx,outId){
  const t=state.cells[targetIdx];
  state.cells[targetIdx]={t:'item',id:outId,patina:0,tare:0,charges:0,rubs:0};
  noteFound(outId);
  noteCraft(outId);
  const it=ALL[outId];
  if(it.chain==='pot') sfx('ding');
  else if(it.chain==='tea'||it.chain==='brew'||it.chain==='brew2') sfx('gurgle');
  else sfx('chime');
  if(it.chain==='tea'||it.chain==='brew'||it.chain==='brew2'){
    if(state.teas.indexOf(outId)<0) state.teas.push(outId);
  }
  render();
  const cell=document.querySelector('.cell[data-i="'+targetIdx+'"] .item');
  if(cell){
    cell.classList.add('pop');
    const verb=(it.chain==='brew')?'萃出':((it.chain==='tea')?'煮出':((it.chain==='raw')?'沏出':''));
    floatText(targetIdx, verb? verb+' '+it.name : it.name);
  }
  save();
}
function tryMerge(aIdx,bIdx){
  const A=state.cells[aIdx],B=state.cells[bIdx];
  if(!A||!B||A.t!=='item'||B.t!=='item'||aIdx===bIdx) return false;
  const r=mergeResult(A.id,B.id);
  if(!r){ toast('这两个合不到一块儿'); sfx('thud'); return false; }
  if(r.err){ toast(r.err); sfx('thud'); return false; }
  if(r.keepPot){
    /* 煮茶不伤壶：只把茶那一格换成煮好的茶，壶原地不动 */
    const aIsPot=!!(ALL[A.id]&&ALL[A.id].pot);
    const teaIdx=aIsPot?bIdx:aIdx;
    doMerge(teaIdx,r.id);
    noteRecipe(A.id,B.id,r.id);
    toast(r.id.indexOf('B_')===0?'用好壶萃出了特调茶':'煮好了');
    return true;
  }
  state.cells[aIdx]={t:'empty'};
  noteRecipe(A.id,B.id,r.id);
  doMerge(bIdx,r.id);
  return true;
}

/* ---------------- 养护（钥匙B） ---------------- */
function isPotCell(i){ const c=state.cells[i]; return !!(c&&c.t==='item'&&ALL[c.id]&&ALL[c.id].pot); }
/* 壶上的五件事，各走各的路，互不重叠：
   烧 burn  = 拖生茶上壶（任何壶都烧得出一杯茶汤）
   萃 steep = 拖茶汤上好壶（防锈以上）→ 萃出特调茶
   灌 water = 拖茶汤上普通壶（素面）→ 给壶补茶水额度
   擦 wash  = 拖草木灰上壶 → 碱洗
   抹 rub   = 长按壶，用手指在壶上划 → 抹抹茶汁（长包浆）
   「茶汤入壶」按壶的档位分两种：普通壶是灌水，好壶是萃。壶的档位写在图标上，
   拖过去时壶上会亮出「灌」或「萃」，不用猜。 */
const ACT_LABEL={burn:'烧茶',steep:'萃特调',water:'灌水',wash:'碱洗',rub:'抹抹茶汁'};
function potAction(dragId,potIdx){
  const c=state.cells[potIdx];
  if(!c||c.t!=='item'||!isPotCell(potIdx)) return null;
  const it=ALL[dragId];
  if(!it) return null;
  if(dragId==='草木灰') return 'wash';
  if(it.chain==='brew2') return 'toptea';
  if(it.chain==='raw') return 'burn';
  if(it.chain==='tea') return potTier(c.id)>=3 ? 'steep' : 'water';
  return null;
}
function enterCare(i){
  const c=state.cells[i];
  if(!isPotCell(i)) return;
  if((c.patina||0)>=100){ toast('这把壶的包浆已经养满了'); return; }
  if(!state.coach.pot){
    state.coach.pot=true; save();
    toast('在壶上划动 = 抹茶汁，每划一段长一点包浆');
  }
  care={idx:i,acc:0,lx:0,ly:0,pts:[]};
  $('#trail').style.display='block';
  showCareBar(i);
  sfx('click');
}
function exitCare(){
  care=null;
  $('#trail').style.display='none';
  $('#careBar').style.display='none';
  render();
}
function showCareBar(i){
  const c=state.cells[i];
  const bar=$('#careBar'), cell=document.querySelector('.cell[data-i="'+i+'"]');
  if(!cell){ bar.style.display='none'; return; }
  const r=cell.getBoundingClientRect();
  bar.style.display='block';
  const next = c.id==='素面铁壶' ? '防锈铁壶' : (c.id==='防锈铁壶' ? '一本堂茶壶' : '已养成');
  bar.innerHTML='<span class="cj">抹抹茶汁</span>包浆 '+Math.round(c.patina||0)+'/100 → '+next+' ｜ 浮灰 '+Math.round(c.tare||0)+' ｜ 茶水 '+(c.charges||0);
  // 先写内容再摆位置：窄屏上别让这条顶出屏幕
  const half=bar.offsetWidth/2+8;

}
let lastRubFloat=0;   // 抹抹茶汁的飘字节流
function doRub(i){
  const c=state.cells[i];
  if(!isPotCell(i)) return false;
  if((c.patina||0)>=100){ toast('包浆满了'); return false; }
  if((c.charges||0)<=0){ toast('壶里没茶水了，拖一杯茶过来'); return false; }
  c.charges--;
  c.rubs=(c.rubs||0)+1;
  if(state.tut&&state.tut.got){ state.tut.got.rub=1; renderMascot(); }   // 教程气泡当场跟进
  const slow=(c.tare||0)>=40;
  const eff=slow?15:25;
  const bonus=c.juiceTop?4:((c.teaS==='mq')?2:((c.teaS==='yq')?1:0));
  const gain=eff+bonus;
  c.patina=Math.min(100,(c.patina||0)+gain);
  c.aged=(c.aged||0)+gain;
  c.juiceN=(c.juiceN||0)+1;
  c.tare=Math.min(100,(c.tare||0)+16);
  if(Date.now()-lastRubFloat>320){ lastRubFloat=Date.now(); floatText(i,'抹茶汁 +'+gain); }
  if(slow) toast('茶垢太厚，抹得慢了 — 先用草木灰擦一遍');
  sfx('rub');
  if(c.patina>=100) upgradePot(i);
  else { refreshPot(i); showCareBar(i); }
  save();
  return true;
}
function upgradePot(i){
  const c=state.cells[i];
  const next = c.id==='素面铁壶' ? '防锈铁壶' : (c.id==='防锈铁壶' ? '一本堂茶壶' : null);
  if(!next) return;
  c.id=next; c.patina=0;
  sfx('ding');
  toast('养成了【'+next+'】！');
  refreshPot(i);
  save();
}
function waterPot(i,teaIdv){
  const c=state.cells[i];
  if(!isPotCell(i)) return false;
  const t=ALL[teaIdv];
  if(!t||t.chain!=='tea') return false;
  const q=t.season==='mq'?2:(t.season==='yq'?1:0);
  const add=4+q;
  c.charges=(c.charges||0)+add;
  c.teaO=t.origin||null;
  c.teaS=t.season||null;
  c.juice=juiceColor(t);
  if(state.tut&&state.tut.got) state.tut.got.potWater=1;
  floatText(i,'灌水 +'+add+' 次');
  toast('灌入'+t.name+'，可抹 '+add+' 次');
  sfx('gurgle');
  render(); save();
  return true;
}
function washPot(i){
  const c=state.cells[i];
  if(!isPotCell(i)) return false;
  c.tare=Math.max(0,(c.tare||0)-60);
  if(state.tut&&state.tut.got) state.tut.got.wash=1;

}

/* ---------------- 障碍 ---------------- */
function clearObstacle(i){
  const c=state.cells[i];
  if(c.t!=='crate'&&c.t!=='weed'&&!(c.t==='gen'&&c.covered)) return;
  if(!adjacentOpen(i)){ toast('要先清掉旁边的障碍，才挖得到这里'); hintNeighbours(i); sfx('thud'); return; }
  const isWeed=c.t==='weed';
  const cost=isWeed?9:26;
  if(state.coins>=cost){ state.coins-=cost; toast('花 '+cost+' 铜钱清开了'+(isWeed?'杂草':'木箱')); }
  else if(state.hammers>0){ state.hammers--; toast('用掉一把锤子敲开了'+(isWeed?'杂草':'木箱')); }
  else { toast('铜钱不够（'+cost+'），先去交货赚点'); sfx('thud'); return; }
  if(c.t==='gen') state.cells[i]={t:'gen',gen:c.gen,covered:false};
  else { state.cells[i]={t:'empty'}; if(!isWeed) state.coins+=8; }
  sfx('thud'); sfx('coin');
  render(); save();
}
function hintNeighbours(i){
  const r=Math.floor(i/SIZE),c=i%SIZE,nb=[];
  if(r>0)nb.push(idxOf(r-1,c)); if(r<SIZE-1)nb.push(idxOf(r+1,c));
  if(c>0)nb.push(idxOf(r,c-1)); if(c<SIZE-1)nb.push(idxOf(r,c+1));
  nb.forEach(n=>{ const e=document.querySelector('.cell[data-i="'+n+'"]'); if(e)e.classList.add('hint'); });
  setTimeout(()=>document.querySelectorAll('.cell.hint').forEach(x=>x.classList.remove('hint')),2600);
}
/* ---------------- 售壶处 ---------------- */
const SELL_PRICE={'生铁壶胚':12,'素面铁壶':45,'防锈铁壶':140,'一本堂茶壶':460};
function sellPrice(cell){
  const it=ALL[cell.id];
  if(!it||!it.pot) return 0;
  let p=SELL_PRICE[cell.id]||20;
  if(cell.id==='一本堂茶壶') p+=Math.round((cell.patina||0)*5);   // 包浆越厚越值钱
  return p;
}
function sellPot(i){

  if(!c||c.t!=='item') return false;

  const nm=ALL[c.id].name;
  state.cells[i]={t:'empty'};
  state.coins+=p;

function recycle(i){

/* ---------------- 订单 ---------------- */
function progOf(npcId,key){ return state.progress[npcId][key]||0; }
function orderComplete(npc){ return orderSlots(npc).every(s=>progOf(npc.id,s.key)>=1); }
function placeSlot(npc,slot,itemId,meta){
  state.progress[npc.id][slot.key]=(state.progress[npc.id][slot.key]||0)+1;
  state.slotLog[npc.id].push(itemId);
  state.slotItems[npc.id].push({key:slot.key,item:itemId});
  const it=ALL[itemId];
  if(it&&it.chain==='pot'){
    const desc=makeTexture();
    state.slotTex[npc.id].push({item:itemId,desc:desc});
    state.codex.push({id:Date.now()+Math.random(),item:itemId,desc:desc,
      rubs:(meta&&meta.rubs)||0, teaO:(meta&&meta.teaO)||null,
      date:new Date().toLocaleDateString('zh-CN')});
  }
}
function deliverItem(npcId,itemId,fromIdx){
  const npc=npcById(npcId);
  if(!npc||state.deliveries<npc.unlock) return false;
  const slot=orderSlots(npc).filter(s=>slotMatches(s,itemId))[0];
  if(!slot) return false;
  if(progOf(npcId,slot.key)>=1) return false;
  let potMeta=null;
  if(fromIdx!=null){
    const c=state.cells[fromIdx];
    if(c.t!=='item'||c.id!==itemId) return false;
    potMeta=c;
    state.cells[fromIdx]={t:'empty'};
  }
  placeSlot(npc,slot,itemId,potMeta);
  sfx('click'); render(); save();
  if(orderComplete(npc)) completeOrder(npc);
  return true;
}
function autoFill(npc){
  const placed=[];
  for(const s of orderSlots(npc)){
    if(progOf(npc.id,s.key)>=1) continue;
    for(let i=0;i<NCELL;i++){
      const c=state.cells[i];
      if(c.t==='item'&&slotMatches(s,c.id)){
        const meta=c;
        state.cells[i]={t:'empty'};
        placeSlot(npc,s,c.id,meta); placed.push(c.id); break;
      }
    }
  }
  return placed;
}
function completeOrder(npc){
  const delivered=state.slotLog[npc.id].slice();
  const entries=state.slotTex[npc.id].slice();
  const items=state.slotItems[npc.id].slice();
  state.progress[npc.id]={}; state.slotTex[npc.id]=[]; state.slotLog[npc.id]=[]; state.slotItems[npc.id]=[];
  state.deliveries++; state.served[npc.id]++;
  if(state.tut&&state.tut.got){
    state.tut.got.delivered=1;
    if(npc.id==='scholar') state.tut.got.delivered2=1;
    if(npc.id==='master') state.tut.got.delivered3=1;
  }
  // 三个订单交齐 = 通关（老掌柜那单是第三单）
  const justCleared=(!state.cleared && state.deliveries>=3);
  if(justCleared) state.cleared=true;
  let bonus=0, praise=null;
  for(const s of items){
    if(s.key==='brew'&&npc.brew==='variant'){
      const it=ALL[s.item];
      if(it&&it.season===state.orders[npc.id].pref){
        bonus=Math.round(npc.coins*0.45);
        praise=(PRAISE[npc.id]&&PRAISE[npc.id][it.season])||null;
      }
    }
  }
  state.coins+=npc.coins+bonus;
  state.diamonds+=npc.diamonds; state.hammers+=npc.hammers; state.parts+=npc.parts;
  dropClay();
  sfx('chime');
  const unseen=TIPS.filter(t=>state.tipsSeen.indexOf(t.t)<0);
  let tip;
  if(unseen.length){ tip=unseen[Math.floor(Math.random()*unseen.length)]; state.tipsSeen.push(tip.t); }
  else tip=TIPS[Math.floor(Math.random()*TIPS.length)];
  render(); save();
  showDelivery(npc,delivered,entries,tip,bonus,praise,justCleared);
}
function showDelivery(npc,delivered,entries,tip,bonus,praise,justCleared){
  const line=npc.lines[Math.floor(Math.random()*npc.lines.length)];
  const rewards=[];
  if(npc.coins)rewards.push('<span>🪙 '+npc.coins+' 铜钱</span>');
  if(bonus)rewards.push('<span class="bonus">🪙 +'+bonus+' 合口味</span>');
  if(npc.diamonds)rewards.push('<span>💎 '+npc.diamonds+' 钻石</span>');

  if(npc.parts)rewards.push('<span>⚙️ '+npc.parts+' 特殊生成器部件</span>');
  const texQ=entries.slice();
  const cards=delivered.map(d=>{

  openSheet('交付',
    '<div class="body">'+

      (cards?'<div class="deliv">'+cards+'</div>':'')+
      '<div class="rewards">'+rewards.join('')+'</div>'+
      (praise?'<div class="praise" style="margin-top:8px">'+praise+'</div>':'')+
      (npc.parts?'<div class="fact" style="margin-top:10px">获得 <b>特殊生成器部件</b>，可在「玩法」里兑换一台特殊生成器（直接产出顶级原料）。</div>':'')+
      '<hr><div class="fact"><b>科普 · '+tip.t+'</b><br>'+tip.d+'</div>'+
    '</div>',
    justCleared
      ? [{label:'听老掌柜说两句',cls:'',keep:true,fn:function(){ showClearSheet(); }}]

const SCENE_NAME={season:'西湖断桥残雪', ten:'三潭印月', craft:'茶室夜灯'};
function sceneFx(setId){
  if(setId==='season'){
    let h='';
    for(let k=0;k<34;k++){
      const d=(4+Math.random()*7).toFixed(1), l=(5+Math.random()*7).toFixed(1), dl=(Math.random()*9).toFixed(1);
      h+='<div class="flake" style="left:'+(Math.random()*100).toFixed(1)+'%;width:'+d+'px;height:'+d+'px;animation-duration:'+l+'s;animation-delay:-'+dl+'s"></div>';
    }
    return h;
  }
  if(setId==='ten') return '<div class="moon"></div><div class="water"></div>';
  if(setId==='craft') return '<div class="lamp"></div><div class="lamp2"></div><div class="steam"></div>';
  return '';
}
function applyScene(){
  const el=$('#scene'); if(!el) return;
  const done=Object.keys(SETS).filter(k=>state.scenes[k]);
  const pick=done.length?done[done.length-1]:null;
  el.className=pick?('on sc-'+pick):'';
  el.innerHTML=pick?sceneFx(pick):'';
}
function openMold(){
  if(state.clayBoxes<=0) return;
  state.clayBoxes--;
  const p=PATTERNS[Math.floor(Math.random()*PATTERNS.length)];
  const isNew=!state.clay[p.id];
  if(isNew) state.clay[p.id]={n:1,date:new Date().toLocaleDateString('zh-CN')};
  else state.clay[p.id].n++;
  const set=SETS[p.set];
  const got=set.items.filter(id=>state.clay[id]).length;
  let unlocked=false;
  if(got>=set.items.length && !state.scenes[p.set]){ state.scenes[p.set]=true; unlocked=true; }
  save(); render(); applyScene();
  showReveal(p,isNew,set,got,unlocked);
  sfx('ding');
}
function dropClay(){
  const guaranteed=(state.deliveries%3===0);
  if(guaranteed||Math.random()<0.35){
    state.clayBoxes++;
    setTimeout(()=>toast('有人送来一个神秘泥模！'),700);
  }
}

/* ---------------- 拖拽 ---------------- */
const ghostEl=$('#ghost');
function makeGhost(id,rot){
  ghostEl.innerHTML=iconHTML(id);
  ghostEl.style.transform='translate(-50%,-50%) scale(1.18) rotate('+(rot||0)+'deg)';
  ghostEl.style.display='block';
}
function moveGhost(x,y){ ghostEl.style.left=x+'px'; ghostEl.style.top=y+'px'; }

function onPointerDown(e){
  Snd.boot();
  const chip=e.target.closest('.chip');
  const itemEl=e.target.closest('.item');
  const genEl=e.target.closest('.gen');
  const obsEl=e.target.closest('.obs');
  const cellEl=e.target.closest('.cell');
  if(!cellEl&&!chip) return;
  const idx=cellEl?+cellEl.dataset.i:null;
  if(e.target.closest('.chip.mold')) return;   // 泥模只响应点击
  if(genEl){ produce(idx); return; }
  let payload=null;
  if(chip&&chip.dataset.mold) return;          // 泥模芯片只点不拖
  if(chip){ return; }                          // 杂物台上没有可拖的东西了
  else if(itemEl){ payload={kind:'board',idx:idx}; makeGhost(state.cells[idx].id,tilt(idx));
    showDragLabel(dragNameFor(state.cells[idx])); }
  else if(obsEl){ payload=null; }
  else return;
  drag={payload:payload,sx:e.clientX,sy:e.clientY,moved:false,care:false};
  // 铁壶：长按进入养护模式
  if(payload&&payload.kind==='board'&&isPotCell(idx)){
    pressTimer=setTimeout(()=>{
      pressTimer=null;
      if(drag&&!drag.moved){ drag.care=true; drag.payload=null; ghostEl.style.display='none'; enterCare(idx); }
    },320);
  }
  try{ e.target.setPointerCapture&&e.target.setPointerCapture(e.pointerId); }catch(err){}
  e.preventDefault();
}
function onPointerMove(e){
  if(!drag) return;
  const dx=e.clientX-drag.sx, dy=e.clientY-drag.sy;
  if(!drag.moved&&Math.abs(dx)+Math.abs(dy)<10) return;
  drag.moved=true;
  if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; }
  if(drag.care){ careMove(e); return; }
  if(!drag.payload) return;
  if(!guideBusy){ guideBusy=true; updateGuide(); }   // 开始拖了，光标先让位
  moveGhost(e.clientX,e.clientY);
  moveDragLabel(e.clientX,e.clientY);
  const t=document.elementFromPoint(e.clientX,e.clientY);
  document.querySelectorAll('.cell.under').forEach(x=>x.classList.remove('under'));
  document.querySelectorAll('.cell.act-burn,.cell.act-steep,.cell.act-water,.cell.act-wash')
    .forEach(x=>x.classList.remove('act-burn','act-steep','act-water','act-wash'));
  $('#recycle').classList.toggle('hot',!!(t&&t.closest('#recycle')));
  $('#sell').classList.toggle('hot',!!(t&&t.closest('#sell')));
  let hoverAct=null;
  if(t){
    const cell=t.closest('.cell');
    if(cell){
      const ti=+cell.dataset.i;
      hoverAct=(drag.payload.kind==='board')?potAction(state.cells[drag.payload.idx].id,ti):null;
      if(hoverAct) cell.classList.add('act-'+hoverAct);
      else cell.classList.add('under');
    }
  }
  updateDragLabel(hoverAct);
}
function careMove(e){
  if(!care) return;
  const i=care.idx;
  const cell=document.querySelector('.cell[data-i="'+i+'"]');
  if(!cell) return;
  const r=cell.getBoundingClientRect();
  const inside = e.clientX>=r.left-6&&e.clientX<=r.right+6&&e.clientY>=r.top-6&&e.clientY<=r.bottom+6;
  if(!inside){ care.pts=[]; drawTrail(); return; }
  const pt={x:e.clientX,y:e.clientY};
  if(care.lx||care.ly){
    const d=Math.hypot(e.clientX-care.lx, e.clientY-care.ly);
    care.acc+=d;
    care.pts.push(pt);
    if(care.pts.length>26) care.pts.shift();
    drawTrail();
    while(care.acc>=RUB_STEP){ care.acc-=RUB_STEP; if(!doRub(i)) break; }
  }
  care.lx=e.clientX; care.ly=e.clientY;
}
function onPointerUp(e){
  if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; }
  if(!drag) return;
  const d=drag; drag=null;
  ghostEl.style.display='none';
  hideDragLabel();
  setTimeout(function(){ guideBusy=false; updateGuide(); },0);   // 松手后光标回来
  $('#recycle').classList.remove('hot');
  $('#sell').classList.remove('hot');
  document.querySelectorAll('.cell.under').forEach(x=>x.classList.remove('under'));
  if(d.care){ exitCare(); return; }
  if(!d.moved){ handleTap(e); return; }
  if(!d.payload) return;
  const t=document.elementFromPoint(e.clientX,e.clientY);
  if(!t) return;
  if(t.closest('#recycle')){ if(d.payload.kind==='board') recycle(d.payload.idx); lastDropAt=Date.now(); return; }
  if(t.closest('#sell')){ if(d.payload.kind==='board') sellPot(d.payload.idx); lastDropAt=Date.now(); return; }
  const npcEl=t.closest('[data-npc]');
  if(npcEl){
    const nid=npcEl.dataset.npc;
    if(d.payload.kind==='board'){
      const id=state.cells[d.payload.idx].id;
      if(!deliverItem(nid,id,d.payload.idx)) toast('这位客人不要这个');
    } else toast('这个不能拖到那儿');
    return;
  }
  const cell=t.closest('.cell');
  if(!cell) return;
  const ti=+cell.dataset.i;
  if(d.payload.kind==='board'){
    if(ti===d.payload.idx) return;
    const A=state.cells[d.payload.idx], B=state.cells[ti];
    if(B.t==='item'){
      const act=potAction(A.id,ti);
      if(act==='toptea'){
        // 以顶级香茗养护：只借用，不消耗（它还要交给书生和老掌柜）
        const c=state.cells[ti];
        c.juice=juiceColor(ALL[A.id]); c.juiceTop=1; c.juiceN=Math.max(c.juiceN||0,2);
        floatText(ti,'顶级茶香');
        toast('以顶级香茗养护：抹出来是金色的，包浆涨得最快（顶级香茗不消耗，交单还够用）');
        sfx('gurgle'); render(); save(); return;
      }
      if(act==='water'){                       // 茶汤 → 普通铁壶 = 灌水
        state.cells[d.payload.idx]={t:'empty'};
        waterPot(ti,A.id); return;
      }
      if(act==='wash'){                        // 棋盘上的草木灰 → 铁壶 = 碱洗
        state.cells[d.payload.idx]={t:'empty'};
        washPot(ti); return;
      }
      tryMerge(d.payload.idx,ti);
    }
    else if(B.t==='empty'){ state.cells[ti]=A; state.cells[d.payload.idx]={t:'empty'}; sfx('click'); render(); save(); }
    else if(B.t==='gen'&&!B.covered) toast('生成器占着位置');
    else toast('先把障碍清掉');
  }
}
function handleTap(e){
  const moldEl=e.target.closest('.chip.mold');
  if(moldEl){ openMold(); return; }
  const chip=e.target.closest('.chip');
  const itemEl=e.target.closest('.item');
  const obsEl=e.target.closest('.obs');
  const cellEl=e.target.closest('.cell');
  if(chip){ return; }
  if(obsEl){ clearObstacle(+cellEl.dataset.i); return; }
  if(itemEl){
    const idx=+cellEl.dataset.i;
    if(sel&&sel.kind==='board'&&sel.idx!==idx){
      const act=potAction(state.cells[sel.idx].id,idx);
      if(act==='water'){                       // 点选也要能灌水
        const id=state.cells[sel.idx].id;
        state.cells[sel.idx]={t:'empty'};
        sel=null; waterPot(idx,id); render(); save(); return;
      }
      if(act==='wash'){                        // 点选也要能碱洗
        state.cells[sel.idx]={t:'empty'};
        sel=null; washPot(idx); render(); save(); return;
      }
      if(tryMerge(sel.idx,idx)){ sel=null; render(); return; }
    }
    if(sel&&sel.kind==='board'&&sel.idx===idx){ sel=null; render(); return; }
    sel={kind:'board',idx:idx};
    render(); return;
  }
  if(cellEl&&sel){
    const idx=+cellEl.dataset.i, c=state.cells[idx];
    if(c.t==='empty'){
      if(sel.kind==='board'){ state.cells[idx]=state.cells[sel.idx]; state.cells[sel.idx]={t:'empty'}; }
      sel=null; sfx('click'); render(); save(); return;
    }
  }
  sel=null; render();
}

/* ---------------- 订单交互 ---------------- */
$('#orders').addEventListener('click',e=>{
  const buy2=e.target.closest('[data-buy2]');
  if(buy2){ buyGarden(buy2.dataset.buy2); return; }
  const btn=e.target.closest('[data-act]');
  if(!btn) return;
  const card=e.target.closest('[data-npc]');
  if(!card) return;
  const nid=card.dataset.npc, npc=npcById(nid);
  if(btn.dataset.act==='give'){
    if(state.deliveries<npc.unlock) return;
    const placed=autoFill(npc);
    if(placed.length){ sfx('click'); render(); save(); }
    if(orderComplete(npc)){ completeOrder(npc); return; }
    const miss=orderSlots(npc).filter(s=>progOf(nid,s.key)<1).map(s=>s.label);
    toast('还差：'+miss.join('、'));
    sfx('thud');
  } else if(btn.dataset.act==='reroll') rerollOrder(nid);
});

/* ---------------- 底部工具 ---------------- */
$('#btnCodex').onclick=openCodex;
$('#btnGarden').onclick=openGardens;
$('#btnTips').onclick=openTips;
$('#btnHelp').onclick=openHelp;
$('#mascotBoy').onclick=openHelp;
$('#wpClose').onclick=closeWallpaper;
$('#sell').onclick=function(){
  if(Date.now()-lastDropAt<700) return;
  toast('售壶处：把养好的铁壶拖过来，就能换成铜钱');
};
$('#btnSound').onclick=()=>{ state.sound=!state.sound; if(state.sound){Snd.boot(); sfx('click');} render(); save(); };
$('#btnReset').onclick=()=>{
  openSheet('重开一局？','<div class="body">当前进度会全部清空，棋盘回到最初的样子。</div>',
    [{label:'确定重开',cls:'',fn:()=>{ state=newState(); sel=null; render(); save(); toast('新的一炉，开张'); }},
     {label:'算了',cls:'ghostbtn'}]);
};

/* ---------------- 事件 ---------------- */
document.addEventListener('pointerdown',onPointerDown,{passive:false});
document.addEventListener('pointermove',onPointerMove,{passive:true});
document.addEventListener('pointerup',onPointerUp);
document.addEventListener('pointercancel',()=>{ if(pressTimer){clearTimeout(pressTimer);pressTimer=null;} drag=null; ghostEl.style.display='none'; hideDragLabel(); guideBusy=false; updateGuide(); if(care)exitCare(); });
document.addEventListener('contextmenu',e=>{ if(e.target.closest('.cell,.chip')) e.preventDefault(); });

/* ---------------- 启动 ---------------- */
state=load();
if(!state){ state=newState(); save(); }
render();
applyScene();
if(!state.intro){ state.intro=true; save(); openHelp(); }
maybeRotateTip();
const rtBtn=document.getElementById('rtClose');
if(rtBtn) rtBtn.onclick=closeRotateTip;
window.addEventListener('resize',maybeRotateTip);
window.addEventListener('orientationchange',()=>{ setTimeout(maybeRotateTip,120); });
</script>
